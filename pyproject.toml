[build-system]
requires = ["setuptools >= 81"]
build-backend = "setuptools.build_meta"

[project]
name = "Spectro_parse"
version = "0.0.1"
description = "takes multiple .dat as input as parses the data into a single data frame"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.9"
dependencies = [
  "openpyxl>=3.1.5",
  "pandas>=3.0.3",
  "pathlib>=1.0.1",
]

[project.optional-dependencies]
#gui=["PyQt6"]
cli= [
  "rich",
  "click",
]

[project.scripts]
spam-cli="spam:main_cli"

#[project.gui-scripts]
#spam-gui = "spam:main_gui"
